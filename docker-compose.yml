version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fairgreen_pharmacy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ******postgres:5432/fairgreen_pharmacy
      PORT: 5000
    ports:
      - '5000:5000'
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - '5173:5173'
    depends_on:
      - backend
